<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v17</title>
    <link rel="stylesheet" href="dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
    <div class="dashboard-container">
        <div class="left-panel">
            <div class="year-control">
                <label for="year-slider">Year: <span id="year-display">Loading...</span></label>
                <input type="range" id="year-slider" min="1990" max="2022" value="2022" step="1" disabled>
            </div>
            
            <div class="map-container">
                <div id="loading" class="loading">Loading data...</div>
                
                <!-- HDI Component Deviation View -->
                <div id="viz-components-container" class="viz-container active">
                    <div id="map-top" class="map-top">
                        <div class="map-label map-label-hdi">HDI Map</div>
                        <div id="legend-top" class="map-legend"></div>
                    </div>
                    <div class="maps-bottom">
                        <div id="map-bottom-1" class="map-bottom">
                            <div class="map-label map-label-health">Health Index Map</div>
                            <div id="legend-bottom-1" class="map-legend"></div>
                        </div>
                        <div id="map-bottom-2" class="map-bottom">
                            <div class="map-label map-label-education">Education Index Map</div>
                            <div id="legend-bottom-2" class="map-legend"></div>
                        </div>
                        <div id="map-bottom-3" class="map-bottom">
                            <div class="map-label map-label-income">Income Index Map</div>
                            <div id="legend-bottom-3" class="map-legend"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="right-panel">
            <div id="region-info" class="region-info" style="display: none;">
                <h3 id="region-name"></h3>
                <p id="region-country"></p>
            </div>
            
            <div id="no-selection" class="no-selection">
                <p>Click on a region on the map to view its HDI time series</p>
            </div>
            
            <div id="chart-container" class="chart-container" style="display: none;">
                <canvas id="time-series-chart"></canvas>
            </div>
            
            <div id="horizon-chart-container" class="horizon-chart-container" style="display: none;">
                <h4 style="margin-bottom: 10px; color: #333;">Horizon Chart</h4>
                <div id="horizon-chart-wrap" class="horizon-chart-wrap">
                    <div id="horizon-chart" class="horizon-chart"></div>
                    <div id="horizon-legend" class="horizon-legend" aria-hidden="false"></div>
                </div>
                <div id="horizon-tooltip" class="horizon-tooltip"></div>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
